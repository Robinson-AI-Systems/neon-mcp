# CI for the Neon MCP. No secrets, no network calls to Neon, read-only token, never pull_request_target.
# The single merge gate is the final `ci` job: it fails unless every job below succeeded.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (secrets, docs, index, lint, write-safety, core imports, budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  unit:
    name: unit (fake Neon)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm test

  rtc:
    name: RTC read-only HTTP subset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # These are the real Neon HTTP handler wires tested against the Hub's
      # RTC 1 read-only subset. NOT full Hub conformance or live acceptance.
      - name: RTC read-only HTTP interop subset (offline)
        run: node scripts/ci-phase.mjs --budget-seconds 180 -- npx vitest run tests/unit/rtc-http.test.js tests/unit/rtc-contract.test.js tests/unit/rtc-passes.test.js

  db:
    name: db (throwaway Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # GitHub-hosted runners are exempt from public Docker Hub pull rate limits.
        # ECR Public hit "toomanyrequests: Data limit exceeded" on main #81.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres

  ci:
    name: ci
    if: always()
    needs: [check, unit, db, rtc]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          CHECK: ${{ needs.check.result }}
          UNIT: ${{ needs.unit.result }}
          DB: ${{ needs.db.result }}
          RTC: ${{ needs.rtc.result }}
        run: |
          echo "check=$CHECK unit=$UNIT db=$DB"
          test "$CHECK" = success
          test "$UNIT" = success
          test "$DB" = success
          test "$RTC" = success
